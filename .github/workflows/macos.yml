name: macOS build

on:
  push:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          sw_vers
          swift --version

      - name: Tests (logique métier)
        run: swift test

      - name: Construction de l'app
        run: ./scripts/build-app.sh

      - name: Captures d'écran
        continue-on-error: true
        run: |
          mkdir -p build/screenshots
          ./build/Metrixator.app/Contents/MacOS/Metrixator --snapshot "$PWD/build/screenshots" &
          PID=$!
          for i in $(seq 1 150); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          ls -la build/screenshots

      - name: Publier les captures dans docs/captures
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          mkdir -p docs/captures
          rm -f docs/captures/*.png
          cp build/screenshots/*.png docs/captures/ 2>/dev/null || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/captures
          git diff --cached --quiet && exit 0
          git commit -m "Captures d'écran générées par la CI"
          git push origin HEAD:${{ github.ref_name }}

      - name: Archive de l'app
        run: cd build && ditto -c -k --keepParent Metrixator.app Metrixator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: build/screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: Metrixator-app
          path: build/Metrixator.zip

  # Vérifie la compilation avec Xcode 26 / SDK macOS 26 (branche `scrollEdgeEffectStyle`).
  build-macos26:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          sw_vers
          swift --version
      - name: Tests et compilation
        run: |
          swift test
          swift build -c release --product Metrixator
