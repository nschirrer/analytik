name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version à publier (ex. 0.1.0) : crée le tag vX.Y.Z et la release GitHub. Laisser vide pour un simple build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Tests et empaquetage macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Résoudre les dépendances
        run: swift package resolve

      - name: Compiler AnalytikCore
        run: swift build --target AnalytikCore

      - name: Tests unitaires
        run: swift test

      - name: Déterminer la version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          RELEASE_INPUT: ${{ github.event.inputs.release_version }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            VERSION="${REF_NAME#v}"
          elif [ -n "$RELEASE_INPUT" ]; then
            VERSION="${RELEASE_INPUT#v}"
          else
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION"

      - name: Empaqueter Analytik.app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" bash scripts/bundle.sh

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Analytik-macOS
          path: dist/*.zip
          if-no-files-found: error

      - name: Publier Package.resolved
        uses: actions/upload-artifact@v4
        with:
          name: Package.resolved
          path: Package.resolved
          if-no-files-found: warn

      - name: Créer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà : envoi du zip."
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "Analytik $TAG" \
              --generate-notes
          fi
