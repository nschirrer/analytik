name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Tests et empaquetage macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Résoudre les dépendances
        run: swift package resolve

      - name: Compiler AnalytikCore
        run: swift build --target AnalytikCore

      - name: Tests unitaires
        run: swift test

      - name: Empaqueter Analytik.app
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$IS_TAG" = "true" ]; then VERSION="${REF_NAME#v}"; else VERSION="0.0.0"; fi
          VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" bash scripts/bundle.sh

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Analytik-macOS
          path: dist/*.zip
          if-no-files-found: error

      - name: Publier Package.resolved
        uses: actions/upload-artifact@v4
        with:
          name: Package.resolved
          path: Package.resolved
          if-no-files-found: warn

      - name: Créer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Analytik $GITHUB_REF_NAME" \
            --generate-notes
